# One-click deploy on Render: Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: sidebyside
    runtime: node
    plan: free # sleeps after 15 min idle; first visit after that takes ~1 min to wake
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /__sbs/health
    envVars:
      - key: APP_PASSWORD
        sync: false # Render asks for it during setup
      - key: ALLOWED_HOSTS
        sync: false # e.g. www.yoursite.com,yoursite.com,*.amplifyapp.com

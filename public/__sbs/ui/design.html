<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Figma design</title>
  <style>
    html, body { margin: 0; background: #fff; }
    img { display: block; }
    .msg { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 32px; color: #444; max-width: 560px; }
    .msg h2 { font-size: 16px; margin: 0 0 6px; color: #111; }
  </style>
  <!-- The same agent the proxied sites get, so scroll sync and annotations work. -->
  <script src="/__sbs/agent.js"></script>
</head>
<body>
  <div id="msg" class="msg">Loading the design from Figma…</div>
  <script>
    (function () {
      var msg = document.getElementById('msg');
      function fail(text) {
        msg.innerHTML = '<h2>Couldn’t load the Figma design</h2>';
        msg.appendChild(document.createTextNode(text));
      }
      var link = new URLSearchParams(location.search).get('figma') || '';
      fetch('/__sbs/figma/render?url=' + encodeURIComponent(link), { credentials: 'same-origin' })
        .then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (j) {
            if (!r.ok) throw new Error(j.error || 'Something went wrong (' + r.status + ').');
            return j;
          });
        })
        .then(function (j) {
          var img = new Image();
          img.alt = 'Figma design';
          img.onload = function () {
            // Show the frame at its real size in CSS pixels, e.g. 1440 wide.
            var w = Math.round(img.naturalWidth / j.scale);
            img.style.width = w + 'px';
            msg.remove();
            document.body.appendChild(img);
            parent.postMessage({ __sbs: 1, type: 'design', width: w }, location.origin);
          };
          img.onerror = function () { fail('Figma rendered the frame, but the image didn’t load. Try reloading.'); };
          img.src = j.src;
        })
        .catch(function (e) { fail(e.message); });
    })();
  </script>
</body>
</html>
